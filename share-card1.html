<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrepHooks Share Card</title>
<style>
  :root {
    --ink: #1a1a1a;
    --grey: #888888;
    --grey-soft: #bdbdbd;
    --line: #e5e5e5;
    --primary: #FF203B;
    --primary-2: #FF5C77;   /* lighter tint for the gradient */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: var(--ink);
    /* iOS / SF Pro stack — re-enabled to match the designer's system font */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 40px 20px 64px;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    align-self: flex-start;
    max-width: 520px;
    width: 100%;
    margin-bottom: 8px;
  }

  /* ---------- View switching ---------- */
  .view { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .view[hidden] { display: none; }

  /* ---------- FORM (black & white only, no accent) ---------- */
  form {
    width: 100%;
    max-width: 420px;
    margin-top: 24px;
  }
  .field { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s;
    resize: vertical;
    min-height: 96px;
    line-height: 1.45;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--ink); }
  .hint { font-size: 11px; color: var(--grey); margin-top: 6px; line-height: 1.4; }

  button { font-family: inherit; cursor: pointer; }
  .btn {
    display: inline-block;
    padding: 13px 32px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    border: 1px solid transparent;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    text-decoration: none;
  }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: #333; border-color: #333; }
  .btn-outline { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn-outline:hover { background: #f5f5f5; border-color: #b0b0b0; }

  .form-actions { margin-top: 28px; display: flex; justify-content: center; }

  /* ---------- CARD (social share image: B&W + primary highlight only) ---------- */
  .card {
    width: min(700px, 94vw);
    aspect-ratio: 4 / 5;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(24px, 4vw, 40px);
    /* REQUIRED for cqi units below to work — container-relative sizing. */
    container-type: inline-size;
  }
  .card .brand {
    color: var(--grey);
    font-weight: 700;
    font-size: clamp(20px, 8.5cqi, 85px);
    letter-spacing: -0.01em;
    /* 3x the normal card rhythm (~32px -> ~96px) between brand and title */
    margin-bottom: clamp(48px, 14cqi, 310px);
    margin-top: clamp(24px, 5cqi, 100px);
  }
  .card .title {
    /* Very bold, index-page heading weight language */
    font-weight: 800;
    letter-spacing: -0.06em;   /* index hero/block h1/h2 tracking */
    line-height: 1.05;
    color: var(--ink);
    white-space: nowrap;
    width: 100%;               /* span card so the box centers for export */
    text-align: center;
    /* cqi = % of the CARD's own width: stays proportional at any size, no overflow */
    font-size: clamp(100px, 75cqi, 170px);
    
  }
  .card .title .hl {
    background: linear-gradient(100deg, var(--primary) 0%, var(--primary-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--primary);
  }
  .card .subtitle {
    font-weight: 800;          /* bolder */
    letter-spacing: -0.08em;   /* tighter tracking */
    color: var(--ink);
    margin-top: 10px;
    line-height: 1.0;         /* safe: tight but glyphs don't collide */
    max-width: 92%;
    font-size: clamp(20px, 12cqi, 100px);   /* bigger, raised cap for high-res export */
    white-space: pre-line;    /* honor manual line breaks from the textarea */
  }
  .card .subsubtitle {
    font-weight: 500;          /* lighter than the subtitle */
    letter-spacing: -0.02em;   /* tighter tracking */
    color: var(--ink);        /* recessive, like the sample */
    margin-top: 9px;           /* a little more separation from the subtitle above */
    line-height: 1.15;         /* safe: tight but glyphs don't collide */
    max-width: 90%;
    font-size: clamp(12px, 7cqi, 50px);
  }
  .card .powered {
    color: var(--grey);
    font-size: clamp(10px, 3cqi, 25px);
    margin-top: auto;
    margin-bottom: auto;
    letter-spacing: 0.03em;
  }
  .card-actions { margin-top: 28px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

  <div class="wordmark">PrepHooks</div>

  <!-- ===== FORM VIEW ===== -->
  <section class="view" id="formView">
    <form id="cardForm" autocomplete="off">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. 87%" value="87%" />
        <div class="hint">The big number or headline text on the card.</div>
      </div>
      <div class="field">
        <label for="subtitle">Subtitle</label>
        <textarea id="subtitle" placeholder="e.g. Nursing Process in July 2026. (use line breaks for multiple lines)">Nursing Process in July 2026.</textarea>
      </div>
      <div class="field">
        <label for="subsubtitle">Caption (small line)</label>
        <input type="text" id="subsubtitle" placeholder="e.g. Top topic • 87% proficiency" value="Top topic • 87% proficiency" />
        <div class="hint">A smaller, recessive line below the subtitle.</div>
      </div>
      <div class="field">
        <label for="highlight">Highlight</label>
        <input type="text" id="highlight" placeholder="e.g. %" value="%" />
        <div class="hint">Any character(s) in the Title matching this value turn brand red. Leave blank for none.</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Generate</button>
      </div>
    </form>
  </section>

  <!-- ===== CARD VIEW ===== -->
  <section class="view" id="cardView" hidden>
    <div class="card" id="card">
      <div class="brand">PrepHooks</div>
      <div class="title" id="cardTitle">87%</div>
      <div class="subtitle" id="cardSubtitle">Nursing Process in July 2026.</div>
      <div class="subsubtitle" id="cardSub2">Top topic • 87% proficiency</div>
      <div class="powered">Powered by PrepHooks Nigeria Limited</div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn btn-outline" id="downloadBtn">Download</button>
      <button type="button" class="btn btn-outline" id="editBtn">Edit</button>
    </div>
  </section>

<script>
  const formView  = document.getElementById('formView');
  const cardView  = document.getElementById('cardView');
  const form      = document.getElementById('cardForm');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub   = document.getElementById('cardSubtitle');
  const cardSub2  = document.getElementById('cardSub2');
  const card      = document.getElementById('card');
  const editBtn   = document.getElementById('editBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // Render the card to a PNG by drawing the live DOM elements onto a canvas.
  // (More reliable than SVG <foreignObject>, which drops CSS + gradient text.)
  function downloadCard() {
    // Render at a FIXED high-res width, independent of the on-screen card size,
    // so the PNG is sharp everywhere (phones would otherwise export ~750px).
    const EXPORT_W = Math.max(card.getBoundingClientRect().width, 1080);
    const scale = 3; // 3x for crisp output

    // Temporarily expand the card to the export width and re-fit the title.
    const savedWidth = card.style.width;
    const savedTitleFontSize = cardTitle.style.fontSize;
    card.style.width = EXPORT_W + 'px';
    guardTitle();

    const cardRect = card.getBoundingClientRect();
    const w = cardRect.width, h = cardRect.height;

    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // White base
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    // Brand + powered + caption: simple centered single-line text
    drawSimpleText(ctx, card.querySelector('.brand'), cardRect);
    drawSimpleText(ctx, card.querySelector('.subsubtitle'), cardRect);
    drawSimpleText(ctx, card.querySelector('.powered'), cardRect);
    // Subtitle: wrap to multiple centered lines (matches DOM wrapping)
    drawWrappedText(ctx, card.querySelector('.subtitle'), cardRect);

    // Title: per-character so the highlight gets the red gradient
    drawTitleText(ctx, cardTitle, cardRect);

    const a = document.createElement('a');
    a.download = 'prephooks-share-card.png';
    a.href = canvas.toDataURL('image/png');
    a.click();

    // Restore the on-screen card to its original size/title.
    card.style.width = savedWidth;
    cardTitle.style.fontSize = savedTitleFontSize;
  }

  function drawSimpleText(ctx, el, cardRect) {
    if (!el) return;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.letterSpacing = cs.letterSpacing || 'normal'; // honor tight tracking like the DOM
    ctx.fillStyle = cs.color;
    ctx.textBaseline = 'middle';
    ctx.textAlign = cs.textAlign === 'center' ? 'center' : 'left';
    const cx = (r.left - cardRect.left) + (ctx.textAlign === 'center' ? r.width / 2 : 0);
    const cy = (r.top - cardRect.top) + r.height / 2;
    ctx.fillText(el.textContent.trim(), cx, cy);
    ctx.letterSpacing = 'normal';
  }

  function drawWrappedText(ctx, el, cardRect) {
    if (!el) return;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.letterSpacing = cs.letterSpacing || 'normal'; // honor tight tracking like the DOM
    ctx.fillStyle = cs.color;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    const maxW = r.width;
    const lineHeight = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.15;
    // Honour manual line breaks (\n) from a textarea, then word-wrap each.
    const paragraphs = el.textContent.split('\n');
    const lines = [];
    paragraphs.forEach(para => {
      const words = para.split(/\s+/).filter(w => w.length);
      if (words.length === 0) { lines.push(''); return; }
      let line = '';
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
    });

    // Vertical-center the block within the subtitle box
    const totalH = lines.length * lineHeight;
    let cy = (r.top - cardRect.top) + r.height / 2 - totalH / 2 + lineHeight / 2;
    const cx = (r.left - cardRect.left) + r.width / 2;
    lines.forEach(l => {
      ctx.fillText(l, cx, cy);
      cy += lineHeight;
    });
    ctx.letterSpacing = 'normal';
  }

  function drawTitleText(ctx, el, cardRect) {
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    const fontSize = parseFloat(cs.fontSize);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.letterSpacing = '0px'; // we advance manually below for consistent measure+draw

    const ls = (cs.letterSpacing && cs.letterSpacing !== 'normal') ? parseFloat(cs.letterSpacing) : 0;
    const chars = el.textContent.split('');
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + ls * Math.max(0, chars.length - 1);

    // Horizontal center of the run, relative to the (already centered) title box
    let x = (r.left - cardRect.left) + (r.width - total) / 2;
    const cy = (r.top - cardRect.top) + r.height / 2;

    const hl = document.getElementById('highlight').value;
    const root = getComputedStyle(document.documentElement);
    const c1 = (root.getPropertyValue('--primary') || '#FF203B').trim();
    const c2 = (root.getPropertyValue('--primary-2') || '#FF5C77').trim();

    chars.forEach((c, i) => {
      if (hl !== '' && c === hl) {
        const grad = ctx.createLinearGradient(x, 0, x + widths[i], 0);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = cs.color;
      }
      ctx.fillText(c, x, cy);
      x += widths[i] + ls;
    });
  }

  const TITLE_FLOOR = 64; // px — last-resort guard so it never overflows (raised so long text stays bigger)

  // Smart fit: render at a big size, then shrink ONLY if it overflows the
  // card. Short text ("13", "A") ends up large; long text shrinks to fit.
  function guardTitle() {
    const cs = getComputedStyle(card);
    const maxW = card.clientWidth - parseFloat(cs.paddingLeft) * 2;
    const maxH = card.clientHeight - parseFloat(cs.paddingTop) * 2;

    // Start large but leave room for the brand gap + subtitle + caption +
    // footer. Cap the title at ~half the card height so the rest fits.
    let size = Math.min(maxH * 0.5, 720);
    cardTitle.style.fontSize = size + 'px';

    // Shrink only while it actually overflows. Watch the CARD's scrollHeight
    // (not just the title's) so the brand + multi-line subtitle + caption +
    // footer all get their space — otherwise the title overlaps them.
    while ((cardTitle.scrollWidth > maxW || card.scrollHeight > card.clientHeight) && size > TITLE_FLOOR) {
      size -= 4;
      cardTitle.style.fontSize = size + 'px';
    }

    // Final pass: shrink the fitted title by 5% for a little more breathing
    // room (smaller title never causes overflow).
    size *= 0.95;
    cardTitle.style.fontSize = size + 'px';
  }

  function render() {
    const title     = document.getElementById('title').value;
    const subtitle  = document.getElementById('subtitle').value;
    const sub2      = document.getElementById('subsubtitle').value;
    const highlight = document.getElementById('highlight').value;

    cardTitle.style.fontSize = ''; // let cqi take over again

    const safe = title.split('').map(ch => {
      const esc = ch.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      if (highlight !== '' && ch === highlight) return `<span class="hl">${esc}</span>`;
      return esc;
    }).join('');

    cardTitle.innerHTML = safe;
    cardSub.textContent = subtitle;
    cardSub2.textContent = sub2;

    // Make the card visible BEFORE measuring — guardTitle needs the real
    // clientWidth/clientHeight (a hidden display:none card reports 0).
    formView.hidden = true;
    cardView.hidden = false;
    guardTitle();
  }

  function showForm() {
    cardView.hidden = true;
    formView.hidden = false;
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); render(); });
  editBtn.addEventListener('click', showForm);
  downloadBtn.addEventListener('click', downloadCard);
  window.addEventListener('resize', () => { if (!cardView.hidden) guardTitle(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrepHooks Celebration Screen — Stat Card Generator</title>
<style>
  :root {
    --ink: #1a1a1a;
    --grey: #888888;
    --grey-soft: #bdbdbd;
    --line: #e5e5e5;
    --magenta: #e6007e;
    --magenta-2: #ff4db0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 40px 20px 64px;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    align-self: flex-start;
    max-width: 520px;
    width: 100%;
    margin-bottom: 8px;
  }

  /* ---------- View switching ---------- */
  .view { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .view[hidden] { display: none; }

  /* ---------- FORM (black & white only, no accent) ---------- */
  form {
    width: 100%;
    max-width: 420px;
    margin-top: 24px;
  }
  .field { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--ink); }
  .hint { font-size: 11px; color: var(--grey); margin-top: 6px; line-height: 1.4; }

  /* Apple-style pill button — solid black, no accent color */
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn {
    display: inline-block;
    padding: 13px 32px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    border: 1px solid transparent;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primary:hover { background: #333; border-color: #333; }
  .btn-outline {
    background: #fff;
    color: var(--ink);
    border-color: var(--line);
  }
  .btn-outline:hover { background: #f5f5f5; border-color: #b0b0b0; }

  .form-actions { margin-top: 28px; display: flex; justify-content: center; }

  /* ---------- CARD (the social share image: B&W + magenta highlight only) ---------- */
  .card {
    width: min(520px, 92vw);
    aspect-ratio: 4 / 5;
    background: #ffffff;
    border: 1px solid var(--ink);   /* border, NOT shadow */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(28px, 5vw, 48px);
  }
  .card .brand {
    color: var(--grey);
    font-size: clamp(13px, 2.4vw, 16px);
    letter-spacing: 0.04em;
    margin-bottom: auto;
  }
  .card .title {
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
    /* vw + clamp: scales with viewport, no horizontal overflow */
    font-size: clamp(48px, 22vw, 200px);
  }
  .card .title .hl {
    background: linear-gradient(100deg, var(--magenta) 0%, var(--magenta-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--magenta);
  }
  .card .subtitle {
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-top: 12px;
    line-height: 1.3;
    max-width: 92%;
    font-size: clamp(18px, 3.4vw, 28px);
  }
  .card .powered {
    color: var(--grey-soft);
    font-size: clamp(11px, 2vw, 12px);
    margin-top: auto;
    letter-spacing: 0.02em;
  }
  .card-actions { margin-top: 28px; display: flex; justify-content: center; }
</style>
</head>
<body>

  <div class="wordmark">PrepHooks</div>

  <!-- ===== FORM VIEW ===== -->
  <section class="view" id="formView">
    <form id="cardForm" autocomplete="off">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. 134" value="134" />
        <div class="hint">The big number or headline text on the card.</div>
      </div>
      <div class="field">
        <label for="subtitle">Subtitle</label>
        <input type="text" id="subtitle" placeholder="e.g. questions attempted in July 2026" value="questions attempted in July 2026" />
      </div>
      <div class="field">
        <label for="highlight">Highlight</label>
        <input type="text" id="highlight" placeholder="e.g. 3" value="3" />
        <div class="hint">Any character(s) in the Title matching this value turn reddish-pink. Leave blank for none.</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Generate</button>
      </div>
    </form>
  </section>

  <!-- ===== CARD VIEW ===== -->
  <section class="view" id="cardView" hidden>
    <div class="card" id="card">
      <div class="brand">Prep Hooks</div>
      <div class="title" id="cardTitle">134</div>
      <div class="subtitle" id="cardSubtitle">questions attempted in July 2026</div>
      <div class="powered">Powered by PrepHooks Nigeria Limited</div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn btn-outline" id="editBtn">Edit</button>
    </div>
  </section>

<script>
  const formView  = document.getElementById('formView');
  const cardView  = document.getElementById('cardView');
  const form      = document.getElementById('cardForm');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub   = document.getElementById('cardSubtitle');
  const card      = document.getElementById('card');
  const editBtn   = document.getElementById('editBtn');

  const TITLE_FLOOR = 40; // px — last-resort guard so it never overflows

  // Safety guard: if clamp/vw still overflows the card, shrink until it fits.
  function guardTitle() {
    const maxW = card.clientWidth - parseFloat(getComputedStyle(card).paddingLeft) * 2;
    let size = parseFloat(getComputedStyle(cardTitle).fontSize);
    while (cardTitle.scrollWidth > maxW && size > TITLE_FLOOR) {
      size -= 2;
      cardTitle.style.fontSize = size + 'px';
    }
  }

  function render() {
    const title     = document.getElementById('title').value;
    const subtitle  = document.getElementById('subtitle').value;
    const highlight = document.getElementById('highlight').value;

    // Reset font-size so clamp() takes over again (clear any prior guard shrink).
    cardTitle.style.fontSize = '';

    const safe = title.split('').map(ch => {
      const esc = ch.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      if (highlight !== '' && ch === highlight) return `<span class="hl">${esc}</span>`;
      return esc;
    }).join('');

    cardTitle.innerHTML = safe;
    cardSub.textContent = subtitle;
    guardTitle();

    formView.hidden = true;
    cardView.hidden = false;
  }

  function showForm() {
    cardView.hidden = true;
    formView.hidden = false;
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); render(); });
  editBtn.addEventListener('click', showForm);
  window.addEventListener('resize', () => {
    if (!cardView.hidden) guardTitle();
  });

  // Initial preview state: show the form first (no card yet).
</script>
</body>
</html>

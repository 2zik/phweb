<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrepHooks Celebration Screen — Stat Card Generator</title>
<style>
  :root {
    --magenta: #e6007e;
    --magenta-light: #ff4db0;
    --ink: #111111;
    --grey: #9a9a9a;
    --grey-light: #bdbdbd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f5;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    gap: 32px;
    flex-wrap: wrap;
  }
  .panel { width: 360px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: #666; font-size: 13px; margin: 0 0 20px; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--magenta); }

  .hint { font-size: 11px; color: #888; margin-top: 4px; }

  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--magenta);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #c8006c; }

  /* ---- The card ---- */
  .card-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .card {
    width: 520px;
    height: 680px;
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px;
    text-align: center;
  }
  .card .brand { color: var(--grey); font-size: 16px; letter-spacing: 0.5px; margin-bottom: auto; }
  .card .title {
    font-size: 200px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -4px;
    color: var(--ink);
    margin: 0;
  }
  .card .title .hl {
    background: linear-gradient(100deg, var(--magenta) 0%, var(--magenta-light) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--magenta);
  }
  .card .subtitle {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 8px;
    line-height: 1.3;
  }
  .card .powered { color: var(--grey-light); font-size: 12px; margin-top: auto; }

  .hidden { display: none; }
  .actions button { width: auto; padding: 10px 18px; margin-top: 0; }
  .actions { display: flex; gap: 10px; }
</style>
</head>
<body>

  <!-- FORM -->
  <div class="panel">
    <h1>Stat Card Generator</h1>
    <p class="lead">PrepHooks share-card builder</p>

    <form id="cardForm">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. 134" value="134" />
      <div class="hint">The big number / headline text.</div>

      <label for="subtitle">Subtitle</label>
      <input type="text" id="subtitle" placeholder="e.g. questions attempted in July 2026" value="questions attempted in July 2026" />

      <label for="highlight">Highlight</label>
      <input type="text" id="highlight" placeholder="e.g. 3" value="3" />
      <div class="hint">Any character(s) in the Title matching this value turn magenta.</div>

      <button type="submit">Generate</button>
    </form>
  </div>

  <!-- PREVIEW -->
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="brand">Prep Hooks</div>
      <div class="title" id="cardTitle">134</div>
      <div class="subtitle" id="cardSubtitle">questions attempted in July 2026</div>
      <div class="powered">Powered by PrepHooks Nigeria Limited</div>
    </div>
    <div class="actions hidden" id="actions">
      <button onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

<script>
  const form = document.getElementById('cardForm');
  const cardTitle = document.getElementById('cardTitle');
  const cardSubtitle = document.getElementById('cardSubtitle');
  const actions = document.getElementById('actions');

  function render() {
    const title = document.getElementById('title').value;
    const subtitle = document.getElementById('subtitle').value;
    const highlight = document.getElementById('highlight').value;

    // Wrap every character whose text matches the highlight value in a .hl span.
    const safe = title
      .split('')
      .map(ch => {
        const esc = ch.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
        if (highlight !== '' && ch === highlight) {
          return `<span class="hl">${esc}</span>`;
        }
        return esc;
      })
      .join('');

    cardTitle.innerHTML = safe;
    cardSubtitle.textContent = subtitle;
    actions.classList.remove('hidden');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    render();
  });

  // Initial render with the default values.
  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download PrepHooks</title>
    <link rel="icon" href="assets/utilities/favicon.webp" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .hooky-block {
            padding: 80px 24px 80px;
            background: #ffffff;
            text-align: center;
            overflow: visible;
            position: relative;
        }
        .hooky-block .inner {
            max-width: 820px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .hooky-icon-wrap {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px;
            width: 120px;
            height: 120px;
        }
        .hooky-icon-wrap::after {
            content: "";
            position: absolute;
            top: 56%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 180px;
            background: linear-gradient(to bottom,
                rgba(255,32,59,0.09) 0%,
                rgba(255,32,59,0.04) 30%,
                rgba(255,32,59,0.015) 50%,
                transparent 78%);
            pointer-events: none;
            z-index: 0;
        }
        .hooky-icon {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 14px;
            display: block;
            position: relative;
            z-index: 1;
        }
        .hooky-block h2 {
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: #1a1a1a;
            margin: 0 0 12px;
        }
        .hooky-sub {
            margin: 0 auto;
            max-width: 480px;
            font-size: 16px;
            color: #555555;
            line-height: 1.65;
            font-weight: 400;
        }
        @media (max-width: 720px) {
            .hooky-block { padding: 56px 20px 56px; }
            .hooky-icon-wrap { width: 120px; height: 120px; }
            .hooky-icon { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>
    <section class="hooky-block" aria-label="Download PrepHooks">
        <div class="inner">
            <div class="hooky-icon-wrap">
                <img src="assets/utilities/hooky.webp" alt="" class="hooky-icon" loading="lazy">
            </div>
            <h2>Now live on Google Play</h2>
            <p class="hooky-sub" style="font-size: 150%; line-height: 130%;">
                Update to the latest version from the same link you joined the closed test with.
            </p>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="assets/utilities/favicon.webp" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .dl-note{max-width:520px;margin:48px auto 0;padding:0 24px;text-align:center;font-size:14px;color:#555555;line-height:1.7}
        @media(max-width:720px){.dl-note{margin-top:32px}}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">PrepHooks</a>
            <nav class="top-nav" id="topNav">
                <a href="about.html">About</a>
                <a href="market.html">Why PrepHooks</a>

    <script>
        const toggle = document.getElementById('navToggle');
        const nav = document.getElementById('topNav');
        if (toggle && nav) {
            toggle.addEventListener('click', () => nav.classList.toggle('open'));
            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => nav.classList.remove('open'));
            });
        }
    </script>
